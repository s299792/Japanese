        <p id="timer">시간: 0초</p>

        <div id="options"></div>
        <button id="next-btn" style="display:none;" onclick="nextQuestion()">다음 문제</button>

            {hanja: '寄', sound: '부칠 기', meaning: '부치다, 의지하다.'},
            {hanja: '害', sound: '해할 해', meaning: '해롭다, 해치다.'},
            {hanja: '官', sound: '벼슬 관', meaning: '벼슬아치, 공무원.'},
            {hanja: '察', sound: '살필 찰', meaning: '살피다, 관찰하다.'},
            {hanja: '宰', sound: '재상 재', meaning: '주관하다, 다스리다.'},
            {hanja: '富', sound: '부유할 부', meaning: '재산이 많다.'},
            {hanja: '實', sound: '열매 실', meaning: '참됨, 실제.'},
            {hanja: '寢', sound: '잠잘 침', meaning: '잠자다, 쉼.'},
            {hanja: '容', sound: '얼굴 용', meaning: '용서하다, 얼굴.'},
            {hanja: '安', sound: '편안할 안', meaning: '편안하다, 안정.'},
            {hanja: '宮', sound: '집 궁', meaning: '궁궐, 큰집.'},
            {hanja: '宵', sound: '밤 소', meaning: '밤, 밤중.'},
            {hanja: '密', sound: '빽빽할 밀', meaning: '빽빽하다, 친밀.'},
            {hanja: '守', sound: '지킬 수', meaning: '지키다, 보호하다.'},
            {hanja: '富', sound: '부유할 부', meaning: '재산이 많다.'},
            {hanja: '容', sound: '얼굴 용', meaning: '용모, 포용.'},
            {hanja: '官', sound: '벼슬 관', meaning: '관리, 공직.'},
            {hanja: '害', sound: '해할 해', meaning: '해치다, 손상.'},
            {hanja: '宿', sound: '잘 숙', meaning: '잠자다, 묵다.'},
            {hanja: '宰', sound: '재상 재', meaning: '주관하다, 다스리다.'},
            {hanja: '察', sound: '살필 찰', meaning: '살피다, 조사하다.'},
            {hanja: '安', sound: '편안할 안', meaning: '평안, 편히 지냄.'},
            {hanja: '富', sound: '부유할 부', meaning: '재산, 부자.'},
            {hanja: '官', sound: '벼슬 관', meaning: '벼슬, 공직자.'},
            {hanja: '客', sound: '손 객', meaning: '손님, 방문자.'},
            {hanja: '寄', sound: '부칠 기', meaning: '부치다, 의탁하다.'},
            {hanja: '寢', sound: '잠잘 침', meaning: '자다, 잠자리.'},
            {hanja: '定', sound: '정할 정', meaning: '정하다, 결정하다.'},
            {hanja: '實', sound: '열매 실', meaning: '참됨, 실제.'},
            {hanja: '富', sound: '부유할 부', meaning: '재산, 부자.'},
            {hanja: '官', sound: '벼슬 관', meaning: '벼슬아치, 공직자.'},
            {hanja: '安', sound: '편안할 안', meaning: '편안하다, 안락하다.'},
            {hanja: '客', sound: '손 객', meaning: '손님, 방문자.'}
        ];

        // 레벨별로 한자 나누기 (60개 단위)
        const itemsPerLevel = 60;
        const totalLevels = Math.ceil(hanjaData.length / itemsPerLevel);

        let currentUser = '';
        let currentLevel = 0;
        let levelData = [];
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let mistakes = [];
        let timerInterval;
        let timeSpent = 0;

        // 레벨 버튼 생성
        function generateLevels() {
            const levelsDiv = document.getElementById('levels');
            for (let i = 1; i <= totalLevels; i++) {
                const btn = document.createElement('button');
                btn.textContent = `Level ${i}`;
                btn.onclick = () => startLevel(i);
                levelsDiv.appendChild(btn);
            }
        }

        // 게임 시작 (이름 선택 후 레벨 선택 보여주기)
        function startGame() {
            currentUser = document.getElementById('user-name').value;
            if (!currentUser) {
                alert('이름을 선택하세요!');
                return;
            }
            document.getElementById('name-select').style.display = 'none';
            document.getElementById('level-select').style.display = 'block';
            generateLevels();
        }

        // 레벨 시작
        function startLevel(level) {
            currentLevel = level;
            levelData = hanjaData.slice((level-1)*itemsPerLevel, level*itemsPerLevel);
            questions = generateQuestions(levelData);
            currentQuestionIndex = 0;
            score = 0;
            mistakes = [];
            timeSpent = 0;
            document.getElementById('level-select').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            document.getElementById('level-title').textContent = `Level ${level} - ${currentUser}`;
            startTimer();
            showQuestion();
        }

        // 문제 생성 (30개 한자->음, 30개 음->한자, 랜덤 섞음)
        function generateQuestions(data) {
            let q = [];
            data.forEach(item => {
                // 한자 -> 음
                q.push({
                    type: 'hanja_to_sound',
                    question: item.hanja,
                    answer: item.sound,
                    meaning: item.meaning
                });
                // 음 -> 한자
                q.push({
                    type: 'sound_to_hanja',
                    question: item.sound,
                    answer: item.hanja,
                    meaning: item.meaning
                });
            });
            // 레벨당 60 한자면 120 문제지만, 요구사항은 60문제라 조정 (각 한자당 하나, 랜덤 타입)
            q = data.map(item => {
                const type = Math.random() < 0.5 ? 'hanja_to_sound' : 'sound_to_hanja';
                return {
                    type,
                    question: type === 'hanja_to_sound' ? item.hanja : item.sound,
                    answer: type === 'hanja_to_sound' ? item.sound : item.hanja,
                    meaning: item.meaning
                };
            });
            // 랜덤 섞기
            q.sort(() => Math.random() - 0.5);
            return q;
        }

        // 문제 보여주기
        function showQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById('question').textContent = q.type === 'hanja_to_sound' 
                ? `이 한자의 음은? ${q.question}` 
                : `이 음의 한자는? ${q.question}`;
            document.getElementById('progress').textContent = `문제 ${currentQuestionIndex + 1} / ${questions.length}`;
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            const options = generateOptions(q.answer, q.type);
            options.forEach(opt => {
                const btn = document.createElement('div');
                btn.classList.add('option');
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt, q.answer, q);
                optionsDiv.appendChild(btn);
            });
            document.getElementById('next-btn').style.display = 'none';
        }

        // 옵션 생성 (정답 + 4 랜덤 오답)
        function generateOptions(correct, type) {
            let allOptions = levelData.map(item => type === 'hanja_to_sound' ? item.sound : item.hanja);
            allOptions = allOptions.filter(opt => opt !== correct); // 정답 제외
            const shuffled = allOptions.sort(() => Math.random() - 0.5).slice(0, 4);
            shuffled.push(correct);
            return shuffled.sort(() => Math.random() - 0.5);
        }

        // 답 체크
        function checkAnswer(selected, correct, q) {
            const options = document.querySelectorAll('.option');
            options.forEach(opt => {
                opt.onclick = null; // 클릭 비활성
                if (opt.textContent === correct) {
                    opt.classList.add('correct');
                }
                if (opt.textContent === selected && selected !== correct) {
                    opt.classList.add('incorrect');
                }
            });
            if (selected === correct) {
                score++;
            } else {
                mistakes.push({
                    question: q.question,
                    selected: selected,
                    correct: correct,
                    meaning: q.meaning,
                    type: q.type
                });
            }
            document.getElementById('next-btn').style.display = 'block';
        }

        // 다음 문제
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                stopTimer();
                showReport();
            }
        }

        // 타이머 시작 (업그레이드: 시간 측정)
        function startTimer() {
            timeSpent = 0;
            timerInterval = setInterval(() => {
                timeSpent++;
                document.getElementById('timer').textContent = `시간: ${timeSpent}초`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        // 리포트 보여주기
        function showReport() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('report-container').style.display = 'block';
            document.getElementById('score').textContent = `점수: ${score} / ${questions.length} (시간: ${timeSpent}초)`;
            const mistakesList = document.getElementById('mistakes');
            mistakesList.innerHTML = '';
            if (mistakes.length === 0) {
                const li = document.createElement('li');
                li.textContent = '모든 문제를 맞혔습니다! 축하해요.';
                mistakesList.appendChild(li);
            } else {
                mistakes.forEach(m => {
                    const li = document.createElement('li');
                    li.innerHTML = `${m.type === 'hanja_to_sound' ? '한자: ' + m.question : '음: ' + m.question} - 당신 선택: <span class="incorrect">${m.selected}</span>, 정답: <span class="correct">${m.correct}</span> (뜻: ${m.meaning})`;
                    mistakesList.appendChild(li);
                });
            }
            // 업그레이드: localStorage에 점수 저장
            localStorage.setItem(`${currentUser}_level${currentLevel}`, `${score}/${questions.length}`);
        }

        // 다시 시작
        function restartGame() {
            document.getElementById('report-container').style.display = 'none';
            document.getElementById('name-select').style.display = 'block';
            document.getElementById('user-name').value = '';
        }
    </script>
